name: loop
on:
  schedule:
    - cron: 17 * * * *
  workflow_dispatch: {}
permissions: {}
concurrency:
  group: loop
  cancel-in-progress: false
jobs:
  cek:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    outputs:
      pulled_id: ${{ steps.up.outputs.artifact-id }}
      pulled_digest: ${{ steps.up.outputs.artifact-digest }}
    steps:
      - name: control
        id: control
        env:
          LOOP_JOB: cek
        run: |
          set -eu
          git clone --quiet --depth 1 --branch main --filter=blob:none --sparse "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$RUNNER_TEMP/control"
          git -C "$RUNNER_TEMP/control" sparse-checkout set bootstrap
          cd "$RUNNER_TEMP/control/bootstrap"
          python3 -m snowball_bootstrap control --control ../control.json --job "$LOOP_JOB" --event "$GITHUB_EVENT_NAME" --github-output "$GITHUB_OUTPUT"
      - name: sigstore
        if: steps.control.outputs.go == 'true'
        run: |
          set -eu
          cd "$RUNNER_TEMP/control/bootstrap"
          python3 -m venv "$RUNNER_TEMP/sig"
          "$RUNNER_TEMP/sig/bin/pip" download --quiet --require-hashes --only-binary=:all: --no-deps -d "$RUNNER_TEMP/sigw" -r requirements/sign.txt
          python3 -m snowball_bootstrap licenses --root .. --wheels "$RUNNER_TEMP/sigw"
          "$RUNNER_TEMP/sig/bin/pip" install --quiet --no-index --find-links "$RUNNER_TEMP/sigw" --require-hashes --only-binary=:all: --no-deps -r requirements/sign.txt
      - name: checkout
        if: steps.control.outputs.go == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: cek
        if: steps.control.outputs.go == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 -m loop.job run cek
      - name: upload pulled
        id: up
        if: steps.control.outputs.go == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pulled
          path: ${{ runner.temp }}/out/pulled
          if-no-files-found: error
  getir:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions: {}
    needs:
      - cek
    outputs:
      deps_id: ${{ steps.up.outputs.artifact-id }}
      deps_digest: ${{ steps.up.outputs.artifact-digest }}
    steps:
      - name: control
        id: control
        env:
          LOOP_JOB: getir
        run: |
          set -eu
          git clone --quiet --depth 1 --branch main --filter=blob:none --sparse "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$RUNNER_TEMP/control"
          git -C "$RUNNER_TEMP/control" sparse-checkout set bootstrap
          cd "$RUNNER_TEMP/control/bootstrap"
          python3 -m snowball_bootstrap control --control ../control.json --job "$LOOP_JOB" --event "$GITHUB_EVENT_NAME" --github-output "$GITHUB_OUTPUT"
      - name: checkout
        if: steps.control.outputs.go == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: download pulled
        if: steps.control.outputs.go == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.cek.outputs.pulled_id }}
          path: ${{ runner.temp }}/in/pulled
          digest-mismatch: error
      - name: getir
        if: steps.control.outputs.go == 'true'
        env:
          LOOP_PULLED_DIGEST: ${{ needs.cek.outputs.pulled_digest }}
        run: |
          python3 -m loop.job run getir
      - name: upload deps
        id: up
        if: steps.control.outputs.go == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: deps
          path: ${{ runner.temp }}/out/deps
          if-no-files-found: error
  kos:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions: {}
    needs:
      - cek
      - getir
    outputs:
      results_id: ${{ steps.up.outputs.artifact-id }}
      results_digest: ${{ steps.up.outputs.artifact-digest }}
    steps:
      - name: control
        id: control
        env:
          LOOP_JOB: kos
        run: |
          set -eu
          git clone --quiet --depth 1 --branch main --filter=blob:none --sparse "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$RUNNER_TEMP/control"
          git -C "$RUNNER_TEMP/control" sparse-checkout set bootstrap
          cd "$RUNNER_TEMP/control/bootstrap"
          python3 -m snowball_bootstrap control --control ../control.json --job "$LOOP_JOB" --event "$GITHUB_EVENT_NAME" --github-output "$GITHUB_OUTPUT"
      - name: checkout
        if: steps.control.outputs.go == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: download pulled
        if: steps.control.outputs.go == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.cek.outputs.pulled_id }}
          path: ${{ runner.temp }}/in/pulled
          digest-mismatch: error
      - name: download deps
        if: steps.control.outputs.go == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.getir.outputs.deps_id }}
          path: ${{ runner.temp }}/in/deps
          digest-mismatch: error
      - name: kos
        if: steps.control.outputs.go == 'true'
        env:
          LOOP_PULLED_DIGEST: ${{ needs.cek.outputs.pulled_digest }}
          LOOP_DEPS_DIGEST: ${{ needs.getir.outputs.deps_digest }}
        run: |
          python3 -m loop.job run kos
      - name: upload results
        id: up
        if: steps.control.outputs.go == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: results
          path: ${{ runner.temp }}/out/results
          if-no-files-found: error
  cagir:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions: {}
    needs:
      - cek
    outputs:
      response_id: ${{ steps.up.outputs.artifact-id }}
      response_digest: ${{ steps.up.outputs.artifact-digest }}
    steps:
      - name: control
        id: control
        env:
          LOOP_JOB: cagir
        run: |
          set -eu
          git clone --quiet --depth 1 --branch main --filter=blob:none --sparse "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$RUNNER_TEMP/control"
          git -C "$RUNNER_TEMP/control" sparse-checkout set bootstrap
          cd "$RUNNER_TEMP/control/bootstrap"
          python3 -m snowball_bootstrap control --control ../control.json --job "$LOOP_JOB" --event "$GITHUB_EVENT_NAME" --github-output "$GITHUB_OUTPUT"
      - name: claude
        if: steps.control.outputs.go == 'true'
        run: |
          set -eu
          C="$RUNNER_TEMP/control/bootstrap/requirements/claude-cli"
          node -e 'process.exit(Number(process.versions.node.split(".")[0]) >= 22 ? 0 : 1)'
          npm ci --prefix "$C" --no-audit --no-fund
          pinned=$(node -p "require('$C/package.json').dependencies['@anthropic-ai/claude-code']")
          test "$("$C/node_modules/.bin/claude" --version | cut -d' ' -f1)" = "$pinned"
      - name: checkout
        if: steps.control.outputs.go == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: download pulled
        if: steps.control.outputs.go == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.cek.outputs.pulled_id }}
          path: ${{ runner.temp }}/in/pulled
          digest-mismatch: error
      - name: cagir
        if: steps.control.outputs.go == 'true'
        env:
          LOOP_PULLED_DIGEST: ${{ needs.cek.outputs.pulled_digest }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          python3 -m loop.job run cagir
      - name: upload response
        id: up
        if: steps.control.outputs.go == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: response
          path: ${{ runner.temp }}/out/response
          if-no-files-found: error
  yaz:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      id-token: write
      contents: read
    needs:
      - cek
      - getir
      - kos
      - cagir
    steps:
      - name: control
        id: control
        env:
          LOOP_JOB: yaz
        run: |
          set -eu
          git clone --quiet --depth 1 --branch main --filter=blob:none --sparse "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$RUNNER_TEMP/control"
          git -C "$RUNNER_TEMP/control" sparse-checkout set bootstrap
          cd "$RUNNER_TEMP/control/bootstrap"
          python3 -m snowball_bootstrap control --control ../control.json --job "$LOOP_JOB" --event "$GITHUB_EVENT_NAME" --github-output "$GITHUB_OUTPUT"
      - name: sigstore
        if: steps.control.outputs.go == 'true'
        run: |
          set -eu
          cd "$RUNNER_TEMP/control/bootstrap"
          python3 -m venv "$RUNNER_TEMP/sig"
          "$RUNNER_TEMP/sig/bin/pip" download --quiet --require-hashes --only-binary=:all: --no-deps -d "$RUNNER_TEMP/sigw" -r requirements/sign.txt
          python3 -m snowball_bootstrap licenses --root .. --wheels "$RUNNER_TEMP/sigw"
          "$RUNNER_TEMP/sig/bin/pip" install --quiet --no-index --find-links "$RUNNER_TEMP/sigw" --require-hashes --only-binary=:all: --no-deps -r requirements/sign.txt
      - name: checkout
        if: steps.control.outputs.go == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: writer scope
        id: scope
        if: steps.control.outputs.go == 'true'
        run: |
          python3 -m loop.job scope
      - name: writer token
        id: app
        if: steps.control.outputs.go == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          app-id: ${{ secrets.WRITER_APP_ID }}
          private-key: ${{ secrets.WRITER_APP_PRIVATE_KEY }}
          owner: ${{ steps.scope.outputs.owner }}
          repositories: ${{ steps.scope.outputs.repositories }}
          permission-contents: write
          permission-pull-requests: write
          permission-checks: write
      - name: download pulled
        if: steps.control.outputs.go == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.cek.outputs.pulled_id }}
          path: ${{ runner.temp }}/in/pulled
          digest-mismatch: error
      - name: download deps
        if: steps.control.outputs.go == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.getir.outputs.deps_id }}
          path: ${{ runner.temp }}/in/deps
          digest-mismatch: error
      - name: download results
        if: steps.control.outputs.go == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.kos.outputs.results_id }}
          path: ${{ runner.temp }}/in/results
          digest-mismatch: error
      - name: download response
        if: steps.control.outputs.go == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.cagir.outputs.response_id }}
          path: ${{ runner.temp }}/in/response
          digest-mismatch: error
      - name: yaz
        if: steps.control.outputs.go == 'true'
        env:
          LOOP_PULLED_DIGEST: ${{ needs.cek.outputs.pulled_digest }}
          LOOP_DEPS_DIGEST: ${{ needs.getir.outputs.deps_digest }}
          LOOP_RESULTS_DIGEST: ${{ needs.kos.outputs.results_digest }}
          LOOP_RESPONSE_DIGEST: ${{ needs.cagir.outputs.response_digest }}
          WRITER_TOKEN: ${{ steps.app.outputs.token }}
          DRILL_SEED: ${{ secrets.DRILL_SEED }}
          DRILL_FIXTURES: ${{ secrets.DRILL_FIXTURES }}
        run: |
          python3 -m loop.job run yaz
